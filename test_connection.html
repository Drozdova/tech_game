<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Connection Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .log {
      background: #252526;
      padding: 10px;
      margin: 5px 0;
      border-left: 3px solid #007acc;
    }
    .error {
      border-left-color: #f48771;
    }
    .success {
      border-left-color: #89d185;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background: #007acc;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #005a9e;
    }
  </style>
</head>
<body>
  <h1>🔌 WebSocket Connection Test</h1>
  <button onclick="testConnection()">Test Connection to ws://localhost:8000</button>
  <button onclick="clearLogs()">Clear Logs</button>
  <div id="logs"></div>

  <script>
    const logsDiv = document.getElementById('logs');

    function log(message, type = 'log') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsDiv.appendChild(div);
      console.log(message);
    }

    function clearLogs() {
      logsDiv.innerHTML = '';
    }

    function testConnection() {
      log('🔄 Attempting to connect to ws://localhost:8000...');
      
      const ws = new WebSocket('ws://localhost:8000');

      ws.onopen = () => {
        log('✅ Connected successfully!', 'success');
        
        // Test sending a message
        const testMessage = {
          id: 1,
          method: 'list_questions',
          args: []
        };
        log(`📤 Sending: ${JSON.stringify(testMessage)}`);
        ws.send(JSON.stringify(testMessage));
      };

      ws.onmessage = (event) => {
        log(`📥 Received: ${event.data}`, 'success');
        try {
          const data = JSON.parse(event.data);
          log(`📊 Parsed response: ${JSON.stringify(data, null, 2)}`, 'success');
        } catch (e) {
          log(`⚠️ Could not parse response: ${e.message}`, 'error');
        }
      };

      ws.onerror = (error) => {
        log(`❌ WebSocket error: ${error}`, 'error');
        console.error('WebSocket error:', error);
      };

      ws.onclose = (event) => {
        log(`🔌 Connection closed. Code: ${event.code}, Reason: ${event.reason || 'No reason'}`, 'error');
      };

      // Close after 5 seconds
      setTimeout(() => {
        if (ws.readyState === WebSocket.OPEN) {
          log('⏱️ Closing connection after 5 seconds...');
          ws.close();
        }
      }, 5000);
    }

    // Auto-test on load
    window.addEventListener('load', () => {
      log('🚀 Page loaded. Click button to test connection.');
    });
  </script>
</body>
</html>
